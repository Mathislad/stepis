# Configuration Supabase CLI — F5L
# Utilisée par la stack locale (`supabase start`) et `supabase db reset`.
project_id = "f5l"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Désactivé en local pour que l'owner du seed puisse se connecter sans e-mail.
enable_confirmations = false
